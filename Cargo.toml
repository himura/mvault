[package]
name = "mvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "mvault command-line tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himura/mvault"
readme = "README.md"

[dependencies]
globset = "0.4.21"
percent-encoding = "2.3.2"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "platform-verifier"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"
