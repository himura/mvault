[package]
name = "mvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "mvault command-line tool"
license = "MIT OR Apache-2.0"
repository = "https://github.com/himura/mvault"
readme = "README.md"

[dependencies]
percent-encoding = "2.3.2"
sha2 = "0.11.0"
thiserror = "2.0.21"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[dev-dependencies]
tempfile = "3.27.0"
